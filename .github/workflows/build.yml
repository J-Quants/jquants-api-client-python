name: build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  merge_group:

jobs:
  linting:
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Poetry
        run: pipx install poetry
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "poetry"
      - name: Install dependencies
        run: poetry install
      - name: Lint
        run: make lint

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ "ubuntu-latest" ]
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]
        # poetry.lock は pandas 2 系で固定されているため、
        # pandas 3 系の動作確認は lock を上書きする専用ジョブで行う
        pandas-version: [ "" ]
        include:
          - os: "ubuntu-latest"
            python-version: "3.11"
            pandas-version: ">=3.0.0"
          - os: "ubuntu-latest"
            python-version: "3.13"
            pandas-version: ">=3.0.0"
    runs-on: ${{ matrix.os }}
    steps:
      #----------------------------------------------
      #       check-out repo 
      #----------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v4
      #----------------------------------------------
      #         install poetry
      #----------------------------------------------
      - name: Install Poetry
        run: pipx install poetry
      #----------------------------------------------
      #         set-up python
      #----------------------------------------------
      - name: Set up python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "poetry"
      #----------------------------------------------
      # install dependencies if cache does not exist
      #----------------------------------------------
      - name: Install dependencies
        run: poetry install
      #----------------------------------------------
      #      override pandas version if specified
      #----------------------------------------------
      - name: Install pandas ${{ matrix.pandas-version }}
        if: matrix.pandas-version != ''
        run: poetry run pip install "pandas${{ matrix.pandas-version }}"
      #----------------------------------------------
      #               run test suite
      #----------------------------------------------
      - name: Run tests
        run: |
          poetry run pytest --cov=./jquants-api-client-python --cov-report=xml tests/
